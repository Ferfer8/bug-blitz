<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Log in</title>
    <link rel="stylesheet" type="text/css" href="styles\Login.css">
    <link rel="icon" type="image/png" href="assets/bugs/bugG-favicon.png"> <!--Adds favicon to website-->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!--points to boxpassIcons CSS file hosted on the web -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!--points to Bootstrap Icons CSS file hosted on the web -->
</head>

<body>
    <header>
        <div id="header">
            <a href="index.html"><img src="assets/Logo.png" alt="Bug Blitz Logo" width="150" height="150"></a>
            <a href="index.html" class="backHome"><i class="bi bi-arrow-bar-left"></i> Back to home</a>
        </div>
    </header>
    <!-- Login form -->
    <div class="box">
        <form action="" id="lForm">
            <h1>Login</h1>
            <div class="input">
                <input type="text" id="identifier" placeholder="Username or email" required>
                <i class='bx bxs-user'></i> <!--boxpassIcons user passIcon -->
                <div class="error"></div>
            </div>
            <div class="input">
                <input type="password" id="password2" placeholder="Password" required>
                <i id="passIcon3" class='bx bxs-lock'></i> <!--boxpassIcons padlock passIcon -->
                <div class="error"></div>
                <h6 id="textToShow2" onclick="showPassword('password2',null)">Show password</h6>
            </div>

            <button type="submit" class="Btn">Login</button>

            <!--Link to Signup Page-->
            <div class="link">
                <p>Don't have an account? <a href="SignUpPage.html">Register</a></p>
            </div>
        </form>
    </div>

</body>
<script src="script/validation.js" defer></script>
<!-- defer attribute used to ensure script runs after HTML contect loads-->

</html>
